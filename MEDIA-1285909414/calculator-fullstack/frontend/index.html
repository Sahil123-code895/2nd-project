<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All-in-One Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="calculator-container">
            <div class="tabs">
                <button class="tab-btn active" data-mode="basic">Basic</button>
                <button class="tab-btn" data-mode="scientific">Scientific</button>
                <button class="tab-btn" data-mode="financial">Financial</button>
            </div>

            <div class="display">
                <div class="input-display" id="input-display">0</div>
                <div class="result-display" id="result-display"></div>
            </div>

            <!-- Basic Calculator -->
            <div class="calculator-mode active" id="basic-mode">
                <div class="button-grid">
                    <button class="btn btn-clear" data-action="clear">C</button>
                    <button class="btn btn-clear" data-action="backspace">⌫</button>
                    <button class="btn btn-operator" data-value="%">%</button>
                    <button class="btn btn-operator" data-value="/">÷</button>
                    
                    <button class="btn btn-number" data-value="7">7</button>
                    <button class="btn btn-number" data-value="8">8</button>
                    <button class="btn btn-number" data-value="9">9</button>
                    <button class="btn btn-operator" data-value="*">×</button>
                    
                    <button class="btn btn-number" data-value="4">4</button>
                    <button class="btn btn-number" data-value="5">5</button>
                    <button class="btn btn-number" data-value="6">6</button>
                    <button class="btn btn-operator" data-value="-">−</button>
                    
                    <button class="btn btn-number" data-value="1">1</button>
                    <button class="btn btn-number" data-value="2">2</button>
                    <button class="btn btn-number" data-value="3">3</button>
                    <button class="btn btn-operator" data-value="+">+</button>
                    
                    <button class="btn btn-number" data-value="0">0</button>
                    <button class="btn btn-number" data-value=".">.</button>
                    <button class="btn btn-equals" data-action="calculate">=</button>
                </div>
            </div>

            <!-- Scientific Calculator -->
            <div class="calculator-mode" id="scientific-mode">
                <div class="button-grid scientific-grid">
                    <button class="btn btn-scientific" data-value="sin(">sin</button>
                    <button class="btn btn-scientific" data-value="cos(">cos</button>
                    <button class="btn btn-scientific" data-value="tan(">tan</button>
                    <button class="btn btn-clear" data-action="clear">C</button>
                    
                    <button class="btn btn-scientific" data-value="log(">log</button>
                    <button class="btn btn-scientific" data-value="ln(">ln</button>
                    <button class="btn btn-scientific" data-value="sqrt(">√</button>
                    <button class="btn btn-operator" data-value="/">÷</button>
                    
                    <button class="btn btn-scientific" data-value="π">π</button>
                    <button class="btn btn-scientific" data-value="e">e</button>
                    <button class="btn btn-scientific" data-value="^">^</button>
                    <button class="btn btn-operator" data-value="*">×</button>
                    
                    <button class="btn btn-scientific" data-value="(">(</button>
                    <button class="btn btn-scientific" data-value=")">)</button>
                    <button class="btn btn-scientific" data-value="abs(">abs</button>
                    <button class="btn btn-operator" data-value="-">−</button>
                    
                    <button class="btn btn-number" data-value="7">7</button>
                    <button class="btn btn-number" data-value="8">8</button>
                    <button class="btn btn-number" data-value="9">9</button>
                    <button class="btn btn-operator" data-value="+">+</button>
                    
                    <button class="btn btn-number" data-value="4">4</button>
                    <button class="btn btn-number" data-value="5">5</button>
                    <button class="btn btn-number" data-value="6">6</button>
                    <button class="btn btn-scientific" data-action="deg-rad">DEG</button>
                    
                    <button class="btn btn-number" data-value="1">1</button>
                    <button class="btn btn-number" data-value="2">2</button>
                    <button class="btn btn-number" data-value="3">3</button>
                    <button class="btn btn-equals" data-action="calculate">=</button>
                    
                    <button class="btn btn-number" data-value="0">0</button>
                    <button class="btn btn-number" data-value=".">.</button>
                    <button class="btn btn-clear" data-action="backspace">⌫</button>
                </div>
            </div>

            <!-- Financial Calculator -->
            <div class="calculator-mode" id="financial-mode">
                <div class="financial-tabs">
                    <button class="financial-tab-btn active" data-calc="loan">Loan</button>
                    <button class="financial-tab-btn" data-calc="interest">Interest</button>
                    <button class="financial-tab-btn" data-calc="mortgage">Mortgage</button>
                    <button class="financial-tab-btn" data-calc="roi">ROI</button>
                </div>

                <!-- Loan Calculator -->
                <div class="financial-calc active" id="loan-calc">
                    <div class="input-group">
                        <label>Principal Amount ($)</label>
                        <input type="number" id="loan-principal" placeholder="10000">
                    </div>
                    <div class="input-group">
                        <label>Interest Rate (%)</label>
                        <input type="number" id="loan-rate" placeholder="5" step="0.1">
                    </div>
                    <div class="input-group">
                        <label>Term (months)</label>
                        <input type="number" id="loan-term" placeholder="36">
                    </div>
                    <button class="btn btn-calculate" data-calc="loan">Calculate EMI</button>
                    <div class="financial-result" id="loan-result"></div>
                </div>

                <!-- Interest Calculator -->
                <div class="financial-calc" id="interest-calc">
                    <div class="input-group">
                        <label>Principal Amount ($)</label>
                        <input type="number" id="interest-principal" placeholder="10000">
                    </div>
                    <div class="input-group">
                        <label>Interest Rate (%)</label>
                        <input type="number" id="interest-rate" placeholder="5" step="0.1">
                    </div>
                    <div class="input-group">
                        <label>Time Period (years)</label>
                        <input type="number" id="interest-time" placeholder="5">
                    </div>
                    <div class="input-group">
                        <label>Type</label>
                        <select id="interest-type">
                            <option value="simple">Simple Interest</option>
                            <option value="compound">Compound Interest</option>
                        </select>
                    </div>
                    <button class="btn btn-calculate" data-calc="interest">Calculate</button>
                    <div class="financial-result" id="interest-result"></div>
                </div>

                <!-- Mortgage Calculator -->
                <div class="financial-calc" id="mortgage-calc">
                    <div class="input-group">
                        <label>Home Price ($)</label>
                        <input type="number" id="mortgage-price" placeholder="300000">
                    </div>
                    <div class="input-group">
                        <label>Down Payment ($)</label>
                        <input type="number" id="mortgage-down" placeholder="60000">
                    </div>
                    <div class="input-group">
                        <label>Interest Rate (%)</label>
                        <input type="number" id="mortgage-rate" placeholder="4.5" step="0.1">
                    </div>
                    <div class="input-group">
                        <label>Loan Term (years)</label>
                        <input type="number" id="mortgage-term" placeholder="30">
                    </div>
                    <button class="btn btn-calculate" data-calc="mortgage">Calculate</button>
                    <div class="financial-result" id="mortgage-result"></div>
                </div>

                <!-- ROI Calculator -->
                <div class="financial-calc" id="roi-calc">
                    <div class="input-group">
                        <label>Initial Investment ($)</label>
                        <input type="number" id="roi-initial" placeholder="10000">
                    </div>
                    <div class="input-group">
                        <label>Final Value ($)</label>
                        <input type="number" id="roi-final" placeholder="15000">
                    </div>
                    <button class="btn btn-calculate" data-calc="roi">Calculate ROI</button>
                    <div class="financial-result" id="roi-result"></div>
                </div>
            </div>
        </div>

        <div class="history-panel">
            <div class="history-header">
                <h3>History</h3>
                <button class="btn-clear-history" id="clear-history">Clear</button>
            </div>
            <div class="history-list" id="history-list"></div>
            <button class="btn-export" id="export-history">Export History</button>
        </div>
    </div>

    <script src="api.js"></script>
    <script src="calculator.js"></script>
    <script src="scientific.js"></script>
    <script src="financial.js"></script>
    <script src="history.js"></script>
</body>
</html>
